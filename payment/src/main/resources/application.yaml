server:
  port: 8083

spring:
  application:
    name: payment
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    # No DB connection held across HTTP calls to gateway/wallet; services manage their own TX boundaries
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: 2000ms
  task:
    execution:
      thread-name-prefix: async-

jwt:
  # RS256 public key (X.509 PEM); verify-only
  public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/jwt_public.pem}
  issuer: ${JWT_ISSUER:gpay-auth}

internal:
  api-key: ${INTERNAL_API_KEY}

services:
  wallet-url: ${WALLET_SERVICE_URL:http://localhost:8082}
  audit-url: ${AUDIT_SERVICE_URL:http://localhost:8084}
  payment-gateway-url: ${PAYMENT_GATEWAY_URL:http://localhost:8085}

payment:
  mock-gateway-secret: ${MOCK_GATEWAY_SECRET}
  daily-transfer-limit: ${DAILY_TRANSFER_LIMIT:10000000}
  rate-limit-per-minute: ${PAYMENT_RATE_LIMIT_PER_MINUTE:5}
  topup-timeout-seconds: ${TOPUP_TIMEOUT_SECONDS:5}
  pending-expire-minutes: ${PENDING_EXPIRE_MINUTES:60}
  # Background jobs: top-up expiry + transfer reconciliation
  scheduler-interval-ms: ${PAYMENT_SCHEDULER_INTERVAL_MS:60000}
  transfer-reconcile-after-seconds: ${TRANSFER_RECONCILE_AFTER_SECONDS:120}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] [userId=%X{userId}] %-5level %logger{36} - %msg%n"
  level:
    com.gpay: INFO
